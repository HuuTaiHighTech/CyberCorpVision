<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>

    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <section class="banner-warp">
        <div class="banner-slider">
            <button class="slick-prev slick-arrow d-block" type="button" aria-label="Previous">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            </button>
          <div class="banner-list"> 
            <div class="slick-list draggable"> 
                <div class="slick-track">
                    <div class="slick-slide" data-slick-index="0" aria-hidden="true"></div>
                    <div class="slick-slide" data-slick-index="1" aria-hidden="true"></div>
                    <div class="slick-slide" data-slick-index="2" aria-hidden="true"></div>
                    <div class="slick-slide" data-slick-index="3" aria-hidden="true"></div>
                </div>
            </div>
          </div>
            <button class="slick-next slick-arrow d-block" type="button" aria-label="Next">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            
            
        </div>
      </section>
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

      <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</body>
</html>
